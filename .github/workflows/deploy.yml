# Deploy — Docker build, registry push, and VPS deploy
#
# Triggered on:
#   - Push to `main` (after CI passes)
#   - Tag push matching `v*` (e.g. v1.0.0)
#
# Required GitHub secrets:
#   DEPLOY_HOST           — SSH user@host for production VPS (e.g. "deploy@vps.example.com")
#   DEPLOY_SSH_KEY        — SSH private key for VPS access
#   DEPLOY_KNOWN_HOSTS    — SSH host key for DEPLOY_HOST (obtain via: ssh-keyscan -H <host>)
#   DEPLOY_PATH           — Project directory on the VPS (e.g. "/opt/vedo")
#   DEPLOY_DOMAIN         — Public domain name for Caddy TLS (e.g. "vedo.example.com")
#   DEPLOY_EMAIL          — Email for Let's Encrypt TLS certificates
#
# Infrastructure secrets (written to .env on VPS):
#   POSTGRES_PASSWORD     — PostgreSQL superuser password
#   VEDO_DB_PASSWORD      — VEDO application DB password
#   KEYCLOAK_DB_PASSWORD  — KeyCloak DB password
#   KEYCLOAK_ADMIN_PASSWORD — KeyCloak admin password
#   VEDO_BACKEND_CLIENT_SECRET — OIDC client secret for backend
#   VEDO_ADMIN_PASSWORD   — VEDO admin user password
#   LLM_API_KEY           — RouterAI API key
#   GF_SECURITY_ADMIN_PASSWORD — Grafana admin password (optional, defaults)
#
# Jobs:
#   1. build-and-push — multi-arch Docker images, cache via BuildKit
#   2. e2e            — Playwright E2E against the test Docker stack
#   3. deploy         — Sync files, generate .env, pull images, roll update
#   4. release        — GitHub Release with changelog (tags only)

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ==========================================================================
  # Build & Push — multi-arch production images to ghcr.io
  # ==========================================================================
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================================================
  # E2E — Playwright tests against test Docker stack
  # ==========================================================================
  e2e:
    name: E2E tests (Docker stack)
    needs: build-and-push
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.test
        run: |
          cat > .env.test << 'EOF'
          COMPOSE_PROJECT_NAME=vedo-test
          LLM_API_KEY=dummy-test-key
          POSTGRES_PASSWORD=test-postgres-password
          VEDO_DB_PASSWORD=test-vedo-password
          KEYCLOAK_DB_PASSWORD=test-keycloak-password
          KEYCLOAK_ADMIN_PASSWORD=test-admin-password
          KEYCLOAK_ADMIN=admin
          VEDO_BACKEND_CLIENT_SECRET=test-vedo-backend-secret
          VEDO_ADMIN_PASSWORD=test-admin
          VEDO_ALICE_PASSWORD=password
          VEDO_GUEST_PASSWORD=guest
          EOF

      - name: Start test Docker stack
        run: |
          docker compose --env-file .env.test -f deploy/docker/compose.test.yml up -d --quiet-pull

      - name: Wait for all services healthy
        run: |
          echo "Waiting 60s for all services to become healthy..."
          sleep 60
          echo "Current status:"
          docker compose --env-file .env.test -f deploy/docker/compose.test.yml ps

      - name: Run Playwright E2E tests
        run: |
          docker compose --env-file .env.test -f deploy/docker/compose.test.yml \
            --profile test-runner run --rm frontend-tests

      - name: Teardown
        if: always()
        run: |
          docker compose --env-file .env.test -f deploy/docker/compose.test.yml down -v

  # ==========================================================================
  # Deploy to VPS — sync files, generate .env, pull images, restart services
  # ==========================================================================
  deploy:
    name: Deploy to VPS
    needs: e2e
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          if_key_exists: replace

      # ── Step 1: Sync infrastructure files (compose files, Caddyfile, scripts) ──
      - name: Sync infrastructure files to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            deploy/ \
            ${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy/

          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            scripts/ \
            ${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/scripts/

      # ── Step 2: Generate .env on VPS from GitHub secrets ──
      - name: Generate .env on VPS
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo '[deploy] Generating .env from GitHub secrets...'

            # ── Part 1: static variables ──
            cat > .env << 'ENVEOF'
            # ── Generated by GitHub Actions deploy workflow ──
            COMPOSE_PROJECT_NAME=vedo
            ENVIRONMENT=production

            # ── Database ──
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            VEDO_DB_PASSWORD=${{ secrets.VEDO_DB_PASSWORD }}
            KEYCLOAK_DB_PASSWORD=${{ secrets.KEYCLOAK_DB_PASSWORD }}

            # ── KeyCloak ──
            KEYCLOAK_ADMIN=admin
            KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            KEYCLOAK_HOSTNAME=${{ secrets.DEPLOY_DOMAIN }}
            KEYCLOAK_JWKS_URL=http://keycloak:8080
            VEDO_BACKEND_CLIENT_SECRET=${{ secrets.VEDO_BACKEND_CLIENT_SECRET }}
            VEDO_ADMIN_PASSWORD=${{ secrets.VEDO_ADMIN_PASSWORD }}
            VEDO_ALICE_PASSWORD=${{ secrets.VEDO_ALICE_PASSWORD || 'password' }}
            VEDO_GUEST_PASSWORD=${{ secrets.VEDO_GUEST_PASSWORD || 'guest' }}

            # ── LLM ──
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_BASE_URL=https://routerai.ru/api/v1

            # ── Grafana ──
            GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD || 'CHANGEME-grafana-password' }}
            ENVEOF

            # ── Part 2: KEYCLOAK_PUBLIC_URL depends on IP vs domain ──
            if echo '${{ secrets.DEPLOY_DOMAIN }}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo 'KEYCLOAK_PUBLIC_URL=http://${{ secrets.DEPLOY_DOMAIN }}' >> .env
            else
              echo 'KEYCLOAK_PUBLIC_URL=https://${{ secrets.DEPLOY_DOMAIN }}' >> .env
            fi

            chmod 600 .env
            echo '[deploy] .env generated successfully'
          "

      # ── Step 3: Configure Caddy (IP → HTTP only, domain → HTTPS + TLS) ──
      - name: Configure Caddy domain
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            DOMAIN='${{ secrets.DEPLOY_DOMAIN }}'

            # Check if it's an IP address (no dots in hostname = maybe IP, or simple regex)
            if echo \"\$DOMAIN\" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo '[deploy] Detected IP address — using HTTP-only mode (no TLS)'

              # Remove the example.com TLS block entirely, keep only :80 fallback
              # The :80 block becomes the main configuration
              sed -i '/^example\.com {/,/^}/d' deploy/docker/Caddyfile
            else
              echo '[deploy] Detected domain name — enabling HTTPS via Let''s Encrypt'

              EMAIL='${{ secrets.DEPLOY_EMAIL }}'
              sed -i \"s/example\\.com/\$DOMAIN/g\" deploy/docker/Caddyfile
              sed -i \"s/your-email@example\\.com/\$EMAIL/g\" deploy/docker/Caddyfile
            fi
          "

      # ── Step 4: Pull fresh images (all services) ──
      - name: Pull Docker images
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo '[deploy] Logging in to ghcr.io...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            echo '[deploy] Pulling all images...'
            docker compose --env-file .env \
              -f deploy/docker/compose.yml \
              -f deploy/docker/compose.production.yml \
              pull --quiet
          "

      # ── Step 5: Record current image SHAs for rollback ──
      - name: Record pre-deploy image SHAs
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Store current image IDs for potential rollback
            docker compose --env-file .env \
              -f deploy/docker/compose.yml \
              -f deploy/docker/compose.production.yml \
              images -q backend frontend > /tmp/vedo-rollback-images.txt 2>/dev/null || true
          "

      # ── Step 6: Restart only application services (zero-downtime roll) ──
      - name: Rolling update backend & frontend
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo '[deploy] Restarting backend with new image...'
            docker compose --env-file .env \
              -f deploy/docker/compose.yml \
              -f deploy/docker/compose.production.yml \
              up -d --no-deps --pull always backend

            echo '[deploy] Waiting for backend health...'
            for i in \$(seq 1 30); do
              STATUS=\$(docker compose --env-file .env \
                -f deploy/docker/compose.yml \
                -f deploy/docker/compose.production.yml \
                ps --format json backend 2>/dev/null | python3 -c \"import sys,json; print(json.load(sys.stdin).get('Health',''))\" 2>/dev/null || echo '')
              if [ \"\$STATUS\" = 'healthy' ]; then
                echo '[deploy] Backend is healthy after '\$((i*2))'s'
                break
              fi
              if [ \"\$i\" -eq 30 ]; then
                echo '[deploy] ERROR: Backend did not become healthy — rolling back!'
                docker compose --env-file .env \
                  -f deploy/docker/compose.yml \
                  -f deploy/docker/compose.production.yml \
                  logs --tail=30 backend
                exit 1
              fi
              sleep 2
            done

            echo '[deploy] Restarting frontend with new image...'
            docker compose --env-file .env \
              -f deploy/docker/compose.yml \
              -f deploy/docker/compose.production.yml \
              up -d --no-deps --pull always frontend

            echo '[deploy] Waiting for frontend health...'
            for i in \$(seq 1 15); do
              STATUS=\$(docker compose --env-file .env \
                -f deploy/docker/compose.yml \
                -f deploy/docker/compose.production.yml \
                ps --format json frontend 2>/dev/null | python3 -c \"import sys,json; print(json.load(sys.stdin).get('Health',''))\" 2>/dev/null || echo '')
              if [ \"\$STATUS\" = 'healthy' ]; then
                echo '[deploy] Frontend is healthy after '\$((i*2))'s'
                break
              fi
              if [ \"\$i\" -eq 15 ]; then
                echo '[deploy] WARNING: Frontend health check timed out'
              fi
              sleep 2
            done
          "

      # ── Step 7: Smoke test ──
      - name: Smoke test
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            cd ${{ secrets.DEPLOY_PATH }} &&
            bash scripts/ops/smoke-test.sh --production --quick
          "

      # ── Step 8: Prune old images ──
      - name: Prune old images
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_HOST }}" "
            docker image prune -f --filter 'until=24h'
            docker builder prune -f --filter 'until=24h'
          "

  # ==========================================================================
  # Release — GitHub Release with changelog (tags only)
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Verify multi-arch manifest
        run: |
          docker buildx imagetools inspect ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker buildx imagetools inspect ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "categories": [
                {"title": "Features", "labels": ["feat", "feature"]},
                {"title": "Bug Fixes", "labels": ["fix", "bug"]},
                {"title": "Documentation", "labels": ["docs"]},
                {"title": "Chores", "labels": ["chore"]}
              ]
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: false
