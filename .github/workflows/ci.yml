name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate sqlx migrations
        run: bash scripts/ci/validate-migrations.sh

  backend:
    runs-on: ubuntu-latest

    services:
      chroma:
        image: chromadb/chroma:0.6.2
        env:
          IS_PERSISTENT: "FALSE"
        ports:
          - 8000:8000
        options: >-
          --health-cmd "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/heartbeat\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vedo
          POSTGRES_PASSWORD: test-vedo-password
          POSTGRES_DB: vedo
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Setup Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} -c rustfmt,clippy
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Format check
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: backend

      - name: Unit tests
        run: cargo test --lib
        working-directory: backend

      - name: Cargo audit (dependency vulnerabilities)
        continue-on-error: true
        run: cargo install cargo-audit --locked && cargo audit
        working-directory: backend

      - name: Integration tests (requires Chroma + PostgreSQL)
        run: cargo test --test integration
        working-directory: backend
        env:
          CHROMA_URL: http://localhost:8000
          DATABASE_URL: postgres://vedo:test-vedo-password@localhost:15432/vedo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint & format check (Biome)
        run: npx @biomejs/biome ci .
        working-directory: frontend

      - name: Test
        run: pnpm run test -- --run
        working-directory: frontend

      - name: Build (type-check + production build)
        run: pnpm run build
        working-directory: frontend

      - name: pnpm audit (dependency vulnerabilities)
        continue-on-error: true
        run: pnpm audit
        working-directory: frontend
